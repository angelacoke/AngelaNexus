name: android-native-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-gate:
    if: github.ref == 'refs/heads/main' && vars.ANGELANEXUS_ANDROID_RELEASE_APPROVED == 'true'
    name: Verify all embedded runtime distribution approvals
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AngelaNexus
        uses: actions/checkout@v4
      - name: Require approved Xray, sing-box, and Mihomo records
        run: python3 scripts/verify_android_runtime_release_gate.py --kernels xray singbox mihomo

  package:
    needs: compliance-gate
    if: github.ref == 'refs/heads/main' && vars.ANGELANEXUS_ANDROID_RELEASE_APPROVED == 'true' && needs.compliance-gate.result == 'success'
    name: Build and package approved Android runtimes from source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANGELANEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_B64 }}
      ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD }}
      ANGELANEXUS_RELEASE_KEY_ALIAS: ${{ secrets.ANGELANEXUS_RELEASE_KEY_ALIAS }}
      ANGELANEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout AngelaNexus
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build canonical Android Core bundle
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run core:android:bundle
          test -s native/android/app/src/main/assets/angelanexus-core.bundle.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Go for pinned Android AAR builds
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"

      - name: Build pinned Xray and sing-box AARs in this runner
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./scripts/build-android-kernel-aars.sh

      - name: Verify Android runtime AARs
        shell: bash
        run: |
          set -euo pipefail
          test -s native/android/app/libs/libXray.aar
          test -s native/android/app/libs/libbox.aar
          test -s native/android/app/libs/libbox-legacy.aar
          unzip -t native/android/app/libs/libXray.aar >/dev/null
          unzip -t native/android/app/libs/libbox.aar >/dev/null
          unzip -t native/android/app/libs/libbox-legacy.aar >/dev/null
          sha256sum native/android/app/libs/libXray.aar native/android/app/libs/libbox.aar native/android/app/libs/libbox-legacy.aar

      - name: Set up Go for pinned Mihomo native build
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"

      - name: Build and install Mihomo libraries from pinned source
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          mkdir -p native/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p native/android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p native/android/app/src/main/jniLibs/x86_64
          : > "$RUNNER_TEMP/mihomo-source.sha256"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            output="$RUNNER_TEMP/mihomo/$abi"
            ./scripts/build-android-mihomo-native.sh "$abi" "$output"
            install -m 0644 "$output/libclash.so" "native/android/app/src/main/jniLibs/$abi/libclash.so"
            sha256sum "native/android/app/src/main/jniLibs/$abi/libclash.so" >> "$RUNNER_TEMP/mihomo-source.sha256"
          done
          cat "$RUNNER_TEMP/mihomo-source.sha256"

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANGELANEXUS_RELEASE_KEYSTORE_B64"
          test -n "$ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANGELANEXUS_RELEASE_KEY_ALIAS"
          test -n "$ANGELANEXUS_RELEASE_KEY_PASSWORD"

      - name: Assemble signed Mihomo-enabled release APK and AAB
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace -Pangelanexus.mihomoDistributionApproved=true assembleRelease bundleRelease

      - name: Verify packaged Mihomo libraries and source hashes
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/release/app-release.apk"
          AAB="native/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libclash.so"
            unzip -l "$APK" | grep -q "lib/$abi/libmihomo-jni.so"
            artifact_sha="$(unzip -p "$APK" "lib/$abi/libclash.so" | sha256sum | cut -d' ' -f1)"
            source_sha="$(awk -v path="native/android/app/src/main/jniLibs/$abi/libclash.so" '$2 == path {print $1}' "$RUNNER_TEMP/mihomo-source.sha256")"
            test -n "$source_sha"
            test "$artifact_sha" = "$source_sha"
            printf '%s libclash.so SHA-256: %s\n' "$abi" "$artifact_sha"
          done

      - name: Verify release certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          printf '%s' "$ANGELANEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > /tmp/angelanexus-release.keystore
          chmod 600 /tmp/angelanexus-release.keystore
          cleanup() { rm -f /tmp/angelanexus-release.keystore; }
          trap cleanup EXIT
          KEYTOOL_OUTPUT="$(keytool -list -v -keystore /tmp/angelanexus-release.keystore -storepass "$ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$ANGELANEXUS_RELEASE_KEY_ALIAS")"
          EXPECTED_CERT_SHA256="$(printf '%s\n' "$KEYTOOL_OUTPUT" | awk '/^[[:space:]]*SHA256:/ {sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"
          test -n "$EXPECTED_CERT_SHA256"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$ACTUAL_CERT_SHA256"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(printf '%s' "$ACTUAL_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED"
          printf 'Production signing certificate verified: %s\n' "$ACTUAL"

      - name: Upload approved signed Mihomo-enabled Android package
        uses: actions/upload-artifact@v4
        with:
          name: AngelaNexus-android-mihomo-${{ github.sha }}
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
