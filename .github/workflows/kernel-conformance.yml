name: kernel-conformance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve maintained kernel versions
        id: versions
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { UpstreamKernelRegistry } from "./src/core/kernel-registry.js";
          console.log("mihomo=" + UpstreamKernelRegistry.mihomo.stable);
          console.log("sing_box=" + UpstreamKernelRegistry["sing-box"].stable);
          console.log("xray=" + UpstreamKernelRegistry.xray.stable);
          NODE
      - name: Download Mihomo
        env:
          VERSION: ${{ steps.versions.outputs.mihomo }}
        run: |
          curl -fsSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/mihomo-linux-amd64-v1-v${VERSION}.gz"
          gunzip -c /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
      - name: Download sing-box
        env:
          VERSION: ${{ steps.versions.outputs.sing_box }}
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          mv "/tmp/sing-box-${VERSION}-linux-amd64/sing-box" /tmp/sing-box
          chmod +x /tmp/sing-box
      - name: Download Xray-core
        env:
          VERSION: ${{ steps.versions.outputs.xray }}
        run: |
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${VERSION}/Xray-linux-64.zip"
          unzip -o /tmp/xray.zip xray -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray
      - name: Verify three-kernel synchronization contract
        run: |
          node --input-type=module <<'NODE'
          import { requireKernelSynchronization } from "./src/kernel/kernel-synchronization.js";
          const report = requireKernelSynchronization();
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Verify kernel versions
        run: |
          /tmp/mihomo -v
          /tmp/sing-box version
          /tmp/xray-bin/xray version
      - name: Generate integration Reality public key
        id: reality
        run: |
          /tmp/sing-box generate reality-keypair 2>&1 | tee /tmp/reality-keypair.txt
          PUBLIC_KEY=$(sed -n 's/^PublicKey: *//p' /tmp/reality-keypair.txt | head -n1)
          test -n "$PUBLIC_KEY"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
      - name: Run real kernel execution lifecycle integration
        env:
          NEXUS_MIHOMO_BIN: /tmp/mihomo
          NEXUS_SING_BOX_BIN: /tmp/sing-box
          NEXUS_XRAY_BIN: /tmp/xray-bin/xray
          NEXUS_REALITY_PUBLIC_KEY: ${{ steps.reality.outputs.public_key }}
        run: node scripts/kernel-execution-integration.mjs
      - name: Run Nexus runtime conformance
        env:
          NEXUS_MIHOMO_BIN: /tmp/mihomo
          NEXUS_SING_BOX_BIN: /tmp/sing-box
          NEXUS_XRAY_BIN: /tmp/xray-bin/xray
        run: npm run kernel:conformance -- --require-binaries

# Runtime capability probe verification trigger.
