name: runtime-artifact-provenance

on:
  push:
    paths:
      - "docs/upstream/*RUNTIME*"
      - "docs/upstream/*COMPLIANCE*"
      - ".github/workflows/runtime-artifact-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: Verify runtime artifact compliance manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/upstream/MIHOMO_ANDROID_RUNTIME_COMPLIANCE.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/upstream/MIHOMO_ANDROID_RUNTIME_COMPLIANCE.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["version"] == 2
          runtime = d["runtime"]
          assert runtime["kernel"] == "mihomo"
          assert runtime["version"] == "1.19.32"
          assert runtime["platform"] == "android"
          assert runtime["linkage"] in {"embedded", "ipc", "process"}
          assert len(runtime["abis"]) == 3

          source = d["source"]
          assert source["repository"].startswith("https://github.com/")
          assert len(source["pinnedCommit"]) == 40
          assert d["declaredLicense"] == "GPL-3.0"

          assert d["policy"]["failClosed"] is True
          assert d["policy"]["noSilentFallback"] is True
          contract = d["policy"]["runtimeContract"]
          assert contract["requiresDistributionApproval"] is True
          assert contract["requiresLicenseReviewApproval"] is True
          assert contract["requiresProvenanceApproval"] is True
          assert contract["requiresNamingComplianceApproval"] is True
          assert d["licenseReview"]["status"] in {"required", "approved"}
          assert d["provenanceReview"]["status"] in {"required", "approved"}
          assert d["namingCompliance"]["status"] in {"required", "approved"}
          print("Mihomo Android compliance manifest: structurally valid")
          print("distributionStatus:", d["distributionStatus"])
          PY

      - name: Enforce approved native distribution gate (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/upstream/MIHOMO_ANDROID_RUNTIME_COMPLIANCE.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          policy = d["policy"]
          contract = policy["runtimeContract"]
          required_contract = (
              "requiresDistributionApproval",
              "requiresLicenseReviewApproval",
              "requiresProvenanceApproval",
              "requiresNamingComplianceApproval",
          )
          gates = {
              "distributionStatus": d["distributionStatus"] == "approved",
              "licenseReview": d["licenseReview"]["status"] == "approved",
              "provenanceReview": d["provenanceReview"]["status"] == "approved",
              "namingCompliance": d["namingCompliance"]["status"] == "approved",
          }
          fail_closed = (
              policy["failClosed"] is True
              and policy["noSilentFallback"] is True
              and all(contract.get(key) is True for key in required_contract)
              and all(gates.values())
          )
          for name, approved in gates.items():
              print(f"{name}: {'approved' if approved else 'blocked'}")
          if not fail_closed:
              raise SystemExit("Mihomo Android distribution gate is blocked")
          print("Mihomo Android distribution gate: approved; fail-closed policy is active")
          PY
