name: sing-box-cross-platform-conformance
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  sing-box:
    name: sing-box conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: sing-box-1.14.3-windows-amd64.zip
          - os: macos-latest
            asset: sing-box-1.14.3-darwin-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Download, verify, and locate sing-box (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.3"
          $asset = $release.assets | Where-Object { $_.name -eq "${{ matrix.asset }}" } | Select-Object -First 1
          if (-not $asset -or -not $asset.digest -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Official release SHA-256 digest is missing for ${{ matrix.asset }}"
          }
          $archive = "$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest.Substring(7)) { throw "Official sing-box archive SHA-256 mismatch" }
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force
          $binary = Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          if (-not $binary) { throw "sing-box.exe was not found in the verified release archive" }
          "NEXUS_SING_BOX_BIN=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary.FullName version
          if ($LASTEXITCODE -ne 0) { throw "sing-box version command failed" }
      - name: Download, verify, and locate sing-box (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --location --silent --show-error https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.3)"
          expected="$(printf '%s' "$release_json" | jq -r --arg asset "${{ matrix.asset }}" '.assets[] | select(.name == $asset) | .digest' | head -n 1)"
          if [[ ! "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Official release SHA-256 digest is missing for ${{ matrix.asset }}" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v1.14.3/${{ matrix.asset }}"
          curl --retry 4 --retry-all-errors --retry-delay 2 --fail --location --silent --show-error "$url" -o "$archive"
          actual="sha256:$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Official sing-box archive SHA-256 mismatch" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sing-box"
          tar -xzf "$archive" -C "$RUNNER_TEMP/sing-box"
          binary="$(find "$RUNNER_TEMP/sing-box" -type f -name sing-box -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "NEXUS_SING_BOX_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" version
      - name: Run sing-box config and capability conformance
        run: npm run kernel:conformance
      - name: Run sing-box loopback data-plane smoke test
        run: node scripts/sing-box-loopback-dataplane.mjs
