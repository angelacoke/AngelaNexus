name: AngelaNexus External Foundation Anchor

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-anchor:
    name: External Anchor — fail closed when active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify external anchor declaration
        shell: bash
        run: |
          chmod +x scripts/verify-external-anchor.sh
          ./scripts/verify-external-anchor.sh
