name: mihomo-android-native-build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mihomo-android-native-build.yml"
      - "native/android/**"
      - "scripts/smoke-mihomo-library.py"
      - "scripts/verify-mihomo-native-artifacts.py"

permissions:
  contents: read

jobs:
  build:
    name: Verify native core build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android24-clang
          - abi: armeabi-v7a
            goarch: arm
            cc: armv7a-linux-androideabi24-clang
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android24-clang

    steps:
      - name: Checkout AngelaNexus
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"

      - name: Test Android lifecycle ownership and dial admission
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v native/android/mihomo-bridge/lifecycle.go native/android/mihomo-bridge/lifecycle_test.go

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"

      - name: Fetch pinned Mihomo source
        shell: bash
        env:
          MIHOMO_COMMIT: "88dcbf7f1614a67c3b36b848ee3592dfa92ada36"
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/MetaCubeX/mihomo.git "$RUNNER_TEMP/mihomo"
          git -C "$RUNNER_TEMP/mihomo" fetch --depth 1 origin "$MIHOMO_COMMIT"
          git -C "$RUNNER_TEMP/mihomo" checkout --detach "$MIHOMO_COMMIT"
          test "$(git -C "$RUNNER_TEMP/mihomo" rev-parse HEAD)" = "$MIHOMO_COMMIT"

      - name: Add AngelaNexus Android bridge
        shell: bash
        working-directory: ${{ runner.temp }}/mihomo
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/native/android/mihomo-bridge/prepare-upstream.py" "$PWD"
          test -s ./listener/sing_tun/server.go
          grep -q "func NewWithOwnedFD" ./listener/sing_tun/server.go
          # Never compile the upstream CLI main/init into the shared library.
          mkdir ./angelanexus_android
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge.go" ./angelanexus_android/bridge.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/lifecycle.go" ./angelanexus_android/lifecycle.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/library.go" ./angelanexus_android/library.go
          grep -q "func startTUN" ./angelanexus_android/bridge.go
          grep -q "angelanexusProtectFd" ./angelanexus_android/bridge.go
          test -z "$(gofmt -d ./angelanexus_android/*.go)"

      - name: Test bridge state against pinned Mihomo on host (not Android TUN)
        if: matrix.abi == 'x86_64'
        shell: bash
        working-directory: ${{ runner.temp }}/mihomo
        run: |
          set -euo pipefail
          # Remove only the platform build constraint for this host cgo test.
          # Always restore the exact Android source before the NDK build.
          trap 'cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge.go" ./angelanexus_android/bridge.go' EXIT
          sed '1,2d' "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge.go" > ./angelanexus_android/bridge.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge_integration_test.go" ./angelanexus_android/bridge_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge_healthcheck_integration_test.go" ./angelanexus_android/bridge_healthcheck_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge_dns_integration_test.go" ./angelanexus_android/bridge_dns_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/library_integration_test.go" ./angelanexus_android/library_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/statistics_integration_test.go" ./tunnel/statistic/angelanexus_statistics_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/late_connections_integration_test.go" ./tunnel/statistic/angelanexus_late_connections_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/late_tunnel_integration_test.go" ./tunnel/angelanexus_late_tunnel_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/quic_sender_integration_test.go" ./component/sniffer/angelanexus_quic_sender_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/nat_local_integration_test.go" ./component/nat/angelanexus_nat_local_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dns_reset_integration_test.go" ./dns/angelanexus_dns_reset_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dns_server_lifecycle_integration_test.go" ./dns/angelanexus_dns_server_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dns_doh_lifecycle_integration_test.go" ./dns/angelanexus_dns_doh_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dns_resolver_lifecycle_integration_test.go" ./dns/angelanexus_dns_resolver_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dns_transport_generation_integration_test.go" ./dns/angelanexus_dns_transport_generation_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dhcp_discovery_lifecycle_integration_test.go" ./component/dhcp/angelanexus_dhcp_discovery_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/ntp_lifecycle_integration_test.go" ./ntp/ntp/angelanexus_ntp_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge_ntp_integration_test.go" ./angelanexus_android/bridge_ntp_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge_mixed_integration_test.go" ./angelanexus_android/bridge_mixed_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge_mixed_udp_integration_test.go" ./angelanexus_android/bridge_mixed_udp_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/udp_lifecycle_integration_test.go" ./listener/socks/angelanexus_udp_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/mixed_lifecycle_integration_test.go" ./listener/mixed/angelanexus_mixed_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/mixed_recreate_integration_test.go" ./listener/angelanexus_mixed_recreate_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/provider_lifecycle_integration_test.go" ./component/resource/angelanexus_provider_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/healthcheck_lifecycle_integration_test.go" ./adapter/provider/angelanexus_healthcheck_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/log_level_integration_test.go" ./log/angelanexus_log_level_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/socks5_lifecycle_integration_test.go" ./adapter/outbound/angelanexus_socks5_lifecycle_integration_test.go
          cp "$GITHUB_WORKSPACE/native/android/mihomo-bridge/dns_outbound_lifecycle_integration_test.go" ./adapter/outbound/angelanexus_dns_outbound_lifecycle_integration_test.go
          # go test exits successfully for an empty -run selection: reject it.
          go test -tags=with_gvisor,cmfa -list '^TestAngelaNexusNATLocal' ./component/nat | grep '^TestAngelaNexusNATLocal'
          go test -race -tags=with_gvisor,cmfa -run '^TestAngelaNexusNATLocal' -count=20 -timeout=90s ./component/nat
          go test -list '^TestAngelaNexusDNSReset' ./dns | grep '^TestAngelaNexusDNSReset'
          go test -race -run '^TestAngelaNexusDNSReset' -count=20 -timeout=120s ./dns
          go test -list '^TestAngelaNexusDNSServer' ./dns | grep '^TestAngelaNexusDNSServer'
          go test -race -run '^TestAngelaNexusDNSServer' -count=20 -timeout=120s ./dns
          go test -list '^TestAngelaNexusDoH' ./dns | grep '^TestAngelaNexusDoH'
          go test -race -run '^TestAngelaNexusDoH' -count=20 -timeout=120s ./dns
          go test -list '^TestAngelaNexusDNSResolver' ./dns | grep '^TestAngelaNexusDNSResolver'
          go test -race -run '^TestAngelaNexusDNSResolver' -count=20 -timeout=180s ./dns
          go test -list '^TestAngelaNexusDNSTransportGeneration' ./dns | grep '^TestAngelaNexusDNSTransportGeneration'
          go test -race -run '^TestAngelaNexusDNSTransportGeneration' -count=20 -timeout=180s ./dns
          go test -list '^TestAngelaNexusDHCPDiscovery' ./component/dhcp | grep '^TestAngelaNexusDHCPDiscovery'
          go test -race -run '^TestAngelaNexusDHCPDiscovery' -count=20 -timeout=120s ./component/dhcp
          go test -list '^TestAngelaNexusNTP' ./ntp/ntp | grep '^TestAngelaNexusNTP'
          go test -race -run '^TestAngelaNexusNTP' -count=20 -timeout=120s ./ntp/ntp
          go test -tags=with_gvisor,cmfa -list '^TestAndroidBridgeDNS' ./angelanexus_android | grep '^TestAndroidBridgeDNS'
          go test -race -tags=with_gvisor,cmfa -run '^TestAndroidBridgeDNS' -count=20 -timeout=120s ./angelanexus_android
          go test -tags=with_gvisor,cmfa -list '^TestAndroidBridgeNTP' ./angelanexus_android | grep '^TestAndroidBridgeNTP'
          go test -race -tags=with_gvisor,cmfa -run '^TestAndroidBridgeNTP' -count=20 -timeout=120s ./angelanexus_android
          go test -list '^TestAngelaNexusProviderLifecycle' ./component/resource | grep '^TestAngelaNexusProviderLifecycle'
          go test -race -run '^TestAngelaNexusProviderLifecycle' -count=20 -timeout=120s ./component/resource
          go test -list '^TestAngelaNexusHealthCheck' ./adapter/provider | grep '^TestAngelaNexusHealthCheck'
          go test -list '^TestAngelaNexusSocks5' ./adapter/outbound | grep '^TestAngelaNexusSocks5'
          go test -race -tags=with_gvisor,cmfa -run '^TestAngelaNexusSocks5' -count=20 -timeout=90s ./adapter/outbound
          go test -tags=with_gvisor,cmfa -list '^TestAngelaNexusDNSOutbound' ./adapter/outbound | grep '^TestAngelaNexusDNSOutbound'
          go test -race -tags=with_gvisor,cmfa -run '^TestAngelaNexusDNSOutbound' -count=20 -timeout=90s ./adapter/outbound
          go test -race -run '^TestAngelaNexusHealthCheck' -count=20 -timeout=120s ./adapter/provider
          go test -race -run '^TestAngelaNexus' -count=1 -timeout=120s ./adapter/provider
          go test -list '^TestAngelaNexusLogLevel' ./log | grep '^TestAngelaNexusLogLevel'
          go test -race -run '^TestAngelaNexusLogLevel' -count=100 -timeout=120s ./log
          go test -list '^TestAngelaNexusLateConnections' ./tunnel/statistic | grep '^TestAngelaNexusLateConnections'
          go test -tags=with_gvisor,cmfa -list '^TestAngelaNexusLateTunnel' ./tunnel | grep '^TestAngelaNexusLateTunnel'
          go test -list '^TestAngelaNexusQUICSender' ./component/sniffer | grep '^TestAngelaNexusQUICSender'
          go test -tags=with_gvisor,cmfa -list '^TestAngelaNexusMixedRecreate' ./listener | grep '^TestAngelaNexusMixedRecreate'
          go test -race -tags=with_gvisor,cmfa -run '^TestAngelaNexusMixedRecreate' -count=20 -timeout=120s ./listener
          go test -list '^TestAngelaNexusMixed' ./listener/mixed | grep '^TestAngelaNexusMixed'
          go test -race -run '^TestAngelaNexusMixed' -count=20 -timeout=120s ./listener/mixed
          go test -list '^TestAngelaNexusMixedUDP' ./listener/socks | grep '^TestAngelaNexusMixedUDP'
          go test -race -run '^TestAngelaNexusMixedUDP' -count=20 -timeout=120s ./listener/socks
          go test -tags=with_gvisor,cmfa -list '^TestAndroidBridgeMixed' ./angelanexus_android | grep '^TestAndroidBridgeMixed'
          go test -race -tags=with_gvisor,cmfa -run '^TestAndroidBridgeMixed' -count=20 -timeout=120s ./angelanexus_android
          python3 "$GITHUB_WORKSPACE/native/android/mihomo-bridge/test-mixed-stop.py" "$PWD" --logs "$RUNNER_TEMP/mixed-stop-negative"
          python3 "$GITHUB_WORKSPACE/native/android/mihomo-bridge/test-mixed-udp-stop.py" "$PWD" --logs "$RUNNER_TEMP/mixed-udp-stop-negative"
          # Test the entire dedicated package that the NDK build consumes.
          go test -race -tags=with_gvisor,cmfa -run '^TestAndroidBridge' -count=1 -timeout=90s -v ./angelanexus_android
          go test -tags=with_gvisor,cmfa -list '^TestAndroidBridgeResourceStopDebt' ./angelanexus_android | grep '^TestAndroidBridgeResourceStopDebt'
          go test -race -tags=with_gvisor,cmfa -run '^TestAndroidBridgeResourceStopDebt' -count=10 -timeout=90s ./angelanexus_android
          python3 "$GITHUB_WORKSPACE/native/android/mihomo-bridge/test-stop-debt.py" "$PWD" --logs "$RUNNER_TEMP/resource-stop-negative"
          go test -race -run '^TestAngelaNexusStatistics' -count=1 -timeout=90s -v ./tunnel/statistic
          go test -race -run '^TestAngelaNexusLateConnections' -count=1 -timeout=90s -v ./tunnel/statistic
          go test -race -tags=with_gvisor,cmfa -run '^TestAngelaNexusLateTunnel' -count=1 -timeout=90s -v ./tunnel
          go test -race -run '^TestAngelaNexusQUICSenderDoSniffCallbackCanReenterClose$' -count=1 -timeout=30s -v ./component/sniffer
          go build -trimpath -tags=with_gvisor,cmfa -buildmode=c-shared -o "$RUNNER_TEMP/libclash-host.so" ./angelanexus_android
          # Foreign host flags must survive dlopen without CLI parsing/exit.
          timeout 30s python3 "$GITHUB_WORKSPACE/scripts/smoke-mihomo-library.py" "$RUNNER_TEMP/libclash-host.so" --foreign-host-flag=library-smoke

      - name: Build native shared object
        shell: bash
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.0.13004108
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        working-directory: ${{ runner.temp }}/mihomo
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK:$PATH"
          export CC="$NDK/${CC}"
          if [ "${GOARCH}" = "arm" ]; then export GOARM=7; fi
          go version
          "$CC" --version
          go build \
            -trimpath \
            -ldflags="-w -s -X github.com/metacubex/mihomo/constant.Version=v1.19.32" \
            -tags="with_gvisor,cmfa" \
            -buildmode=c-shared \
            -o "$RUNNER_TEMP/libclash-${{ matrix.abi }}.so" \
            ./angelanexus_android

      - name: Verify native artifact and generate provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/libclash-${{ matrix.abi }}.so"
          file "$RUNNER_TEMP/libclash-${{ matrix.abi }}.so"
          sha256sum "$RUNNER_TEMP/libclash-${{ matrix.abi }}.so"
          nm -D --defined-only "$RUNNER_TEMP/libclash-${{ matrix.abi }}.so" > "$RUNNER_TEMP/mihomo-symbols.txt"
          for symbol in angelaInit angelaApplyConfig startTUN angelaStopTun stopTun suspend forceGC getTraffic getTotalTraffic freeCString; do
            grep -Eq "[[:space:]]${symbol}$" "$RUNNER_TEMP/mihomo-symbols.txt"
          done

      - name: Generate native build provenance evidence
        shell: bash
        env:
          MIHOMO_COMMIT: "88dcbf7f1614a67c3b36b848ee3592dfa92ada36"
          MIHOMO_VERSION: "1.19.32"
          NDK_VERSION: "28.0.13004108"
          ANDROID_NDK_ROOT: "/usr/local/lib/android/sdk/ndk/28.0.13004108"
        run: |
          set -euo pipefail
          ARTIFACT="$RUNNER_TEMP/libclash-${{ matrix.abi }}.so"
          ARTIFACT_SHA256="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          BRIDGE_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/bridge.go" | awk '{print $1}')"
          LIFECYCLE_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/lifecycle.go" | awk '{print $1}')"
          LIBRARY_ENTRY_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/library.go" | awk '{print $1}')"
          ADAPTER_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/prepare-upstream.py" | awk '{print $1}')"
          MIXED_LIFECYCLE_PATCH_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/mixed-lifecycle.patch" | awk '{print $1}')"
          PATCHED_MIXED_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/mixed/mixed.go" | awk '{print $1}')"
          PATCHED_MIXED_REGISTRY_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/mixed/lifecycle.go" | awk '{print $1}')"
          PATCHED_LISTENER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/listener.go" | awk '{print $1}')"
          PATCHED_MIXED_UDP_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/socks/udp.go" | awk '{print $1}')"
          PATCHED_MIXED_UDP_REGISTRY_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/socks/udp_lifecycle.go" | awk '{print $1}')"
          PATCHED_SERVER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/sing_tun/server.go" | awk '{print $1}')"
          STATISTICS_PATCH_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/statistics.patch" | awk '{print $1}')"
          PATCHED_LATE_MANAGER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/tunnel/statistic/manager.go" | awk '{print $1}')"
          LATE_CONNECTIONS_PATCH_SHA256="$(sha256sum "$GITHUB_WORKSPACE/native/android/mihomo-bridge/late-connections.patch" | awk '{print $1}')"
          PATCHED_TRACKER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/tunnel/statistic/tracker.go" | awk '{print $1}')"
          PATCHED_TUNNEL_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/tunnel/tunnel.go" | awk '{print $1}')"
          PATCHED_NAT_TABLE_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/component/nat/table.go" | awk '{print $1}')"
          PATCHED_QUIC_SNIFFER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/component/sniffer/quic_sniffer.go" | awk '{print $1}')"
          PATCHED_TPROXY_PACKET_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/listener/tproxy/packet.go" | awk '{print $1}')"
          PATCHED_CONNECTION_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/tunnel/connection.go" | awk '{print $1}')"
          PATCHED_DNS_RESOLVER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/resolver.go" | awk '{print $1}')"
          PATCHED_DNS_SERVER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/server.go" | awk '{print $1}')"
          PATCHED_DNS_DOH_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/doh.go" | awk '{print $1}')"
          PATCHED_DNS_CLIENT_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/client.go" | awk '{print $1}')"
          PATCHED_DNS_TLS_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/dot.go" | awk '{print $1}')"
          PATCHED_DNS_DHCP_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/dhcp.go" | awk '{print $1}')"
          PATCHED_DNS_UTIL_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/dns/util.go" | awk '{print $1}')"
          PATCHED_DHCP_DISCOVERY_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/component/dhcp/dhcp.go" | awk '{print $1}')"
          PATCHED_NTP_SERVICE_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/ntp/ntp/service.go" | awk '{print $1}')"
          PATCHED_SOCKS5_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/adapter/outbound/socks5.go" | awk '{print $1}')"
          PATCHED_DNS_OUTBOUND_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/adapter/outbound/dns.go" | awk '{print $1}')"
          PATCHED_PROVIDER_FETCHER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/component/resource/fetcher.go" | awk '{print $1}')"
          PATCHED_PROVIDER_HEALTHCHECK_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/adapter/provider/healthcheck.go" | awk '{print $1}')"
          PATCHED_PROXY_PROVIDER_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/adapter/provider/provider.go" | awk '{print $1}')"
          PATCHED_LOG_SHA256="$(sha256sum "$RUNNER_TEMP/mihomo/log/log.go" | awk '{print $1}')"
          GO_VERSION="$(go version | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_PATH="$NDK_BIN/${{ matrix.cc }}"
          test -x "$CC_PATH"
          COMPILER_VERSION="$("$CC_PATH" --version | head -n 1 | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          SOURCE_HEAD="$(git -C "$RUNNER_TEMP/mihomo" rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$MIHOMO_COMMIT"
          python3 - <<PY
          import json
          from pathlib import Path
          out = Path("$RUNNER_TEMP/mihomo-provenance-${{ matrix.abi }}.json")
          data = {
              "version": 1,
              "kernel": "mihomo",
              "kernelVersion": "$MIHOMO_VERSION",
              "source": {"repository": "https://github.com/MetaCubeX/mihomo", "commit": "$SOURCE_HEAD"},
              "platform": "android",
              "abi": "${{ matrix.abi }}",
              "toolchain": {"go": "$GO_VERSION", "androidNdk": "$NDK_VERSION", "compiler": "$COMPILER_VERSION", "goos": "android", "goarch": "${{ matrix.goarch }}", "goarm": "7" if "${{ matrix.goarch }}" == "arm" else None, "cgoEnabled": True},
              "build": {"trimpath": True, "buildmode": "c-shared", "package": "./angelanexus_android", "tags": ["with_gvisor", "cmfa"], "versionLdflag": "github.com/metacubex/mihomo/constant.Version=v1.19.32"},
              "bridge": {"path": "native/android/mihomo-bridge/bridge.go", "sha256": "$BRIDGE_SHA256"},
              "lifecycle": {"path": "native/android/mihomo-bridge/lifecycle.go", "sha256": "$LIFECYCLE_SHA256"},
              "libraryEntry": {"path": "native/android/mihomo-bridge/library.go", "sha256": "$LIBRARY_ENTRY_SHA256"},
              "ownershipAdapter": {"path": "native/android/mihomo-bridge/prepare-upstream.py", "sha256": "$ADAPTER_SHA256", "patchedSource": {"path": "listener/sing_tun/server.go", "sha256": "$PATCHED_SERVER_SHA256"}},
              "dnsResolver": {"path": "dns/resolver.go", "sha256": "$PATCHED_DNS_RESOLVER_SHA256"},
