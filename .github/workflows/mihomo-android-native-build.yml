name: mihomo-android-native-build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mihomo-android-native-build.yml"
      - "docs/upstream/MIHOMO_ANDROID_RUNTIME_COMPLIANCE.json"
      - "native/android/mihomo-bridge/**"
      - "native/android/app/src/main/kotlin/app/angelanexus/Mihomo*.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/AndroidKernelDriverRegistry.kt"
      - "scripts/build-android-mihomo-native.sh"

permissions:
  contents: read

jobs:
  build:
    name: Verify Mihomo Android native build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
          - abi: armeabi-v7a
          - abi: x86_64

    steps:
      - name: Checkout AngelaNexus
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"

      - name: Build pinned Mihomo source for this ABI
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ABI: ${{ matrix.abi }}
        run: ./scripts/build-android-mihomo-native.sh "$ABI" "$RUNNER_TEMP/mihomo/$ABI"

      - name: Verify local native artifact and provenance
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          MIHOMO_COMMIT: "88dcbf7f1614a67c3b36b848ee3592dfa92ada36"
        run: |
          set -euo pipefail
          ARTIFACT="$RUNNER_TEMP/mihomo/$ABI/libclash.so"
          PROVENANCE="$RUNNER_TEMP/mihomo/$ABI/mihomo-provenance.json"
          test -s "$ARTIFACT"
          test -s "$PROVENANCE"
          sha256sum "$ARTIFACT"
          python3 - "$ARTIFACT" "$PROVENANCE" "$ABI" "$MIHOMO_COMMIT" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          artifact = Path(sys.argv[1])
          record = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_abi, expected_commit = sys.argv[3], sys.argv[4]
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert record["abi"] == expected_abi, "provenance ABI mismatch"
          assert record["source"]["commit"] == expected_commit, "source commit mismatch"
          assert record["artifact"]["sha256"] == digest, "artifact checksum mismatch"
          print(f"Verified local {expected_abi} artifact and source provenance: {digest}")
          PY
