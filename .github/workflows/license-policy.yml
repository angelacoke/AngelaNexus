name: License Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  license-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required license files
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s NOTICE
          test -s docs/legal/LICENSE_POLICY.md
          test -s docs/legal/THIRD_PARTY_LICENSES.md
          test -s docs/legal/COPYRIGHT.md
          grep -q "Apache License" LICENSE
          grep -q "SPDX identifier: Apache-2.0" docs/legal/LICENSE_POLICY.md

      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.license!=="Apache-2.0") process.exit(1);'
