name: Foundation Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-integrity:
    name: Verify immutable project foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify foundation Git object
        shell: bash
        run: |
          set -euo pipefail
          file="docs/ANGELANEXUS_FOUNDATION.md"
          expected="4f047d7a53ef7db1d18174916ea9ed5cacbd8133"
          test -f "$file"
          actual="$(git rev-parse "HEAD:$file")"
          test "$actual" = "$expected"

      - name: Verify constitution points to foundation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'docs/ANGELANEXUS_FOUNDATION.md' docs/ANGELANEXUS_CONSTITUTION.md
          grep -Fq '纲领之基' docs/ANGELANEXUS_CONSTITUTION.md

      - name: Emit machine-readable integrity result
        run: echo "FOUNDATION_INTEGRITY=PASS"
