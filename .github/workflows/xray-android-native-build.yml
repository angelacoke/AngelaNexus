name: xray-android-native-build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xray-android-native-build.yml"
      - "docs/upstream/XRAY_ANDROID_RUNTIME_COMPLIANCE.json"
      - "scripts/build-android-kernel-aars.sh"
      - "native/android/xray-bridge/**"
      - "native/android/app/src/main/kotlin/app/angelanexus/XrayRuntime*.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/XrayAndroidKernelDriver.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/XrayVpnProtector.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/AndroidKernelDriverRegistry.kt"
      - "native/android/app/build.gradle.kts"
      - "native/android/app/src/main/AndroidManifest.xml"

permissions:
  contents: read

jobs:
  build:
    name: Verify native Xray runtime build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout AngelaNexus
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"

      - name: Fetch pinned libXray source
        shell: bash
        env:
          LIBXRAY_COMMIT: "3c694b23290f9849fe52284a345ebd4343bc90cd"
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/XTLS/libXray.git "$RUNNER_TEMP/libXray"
          git -C "$RUNNER_TEMP/libXray" fetch origin "$LIBXRAY_COMMIT"
          git -C "$RUNNER_TEMP/libXray" checkout --detach "$LIBXRAY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/libXray" rev-parse HEAD)" = "$LIBXRAY_COMMIT"
          git -C "$RUNNER_TEMP/libXray" rev-parse HEAD

      - name: Build Android libXray in this runner only
        shell: bash
        working-directory: ${{ runner.temp }}/libXray
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
          LIBXRAY_GOMOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"
        run: |
          set -euo pipefail
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p "$RUNNER_TEMP/xray"
          cp libXray.aar "$RUNNER_TEMP/xray/libXray.aar"

      - name: Verify temporary AAR and record unresolved build inputs
        shell: bash
        env:
          LIBXRAY_COMMIT: "3c694b23290f9849fe52284a345ebd4343bc90cd"
        run: |
          set -euo pipefail
          ARTIFACT="$RUNNER_TEMP/xray/libXray.aar"
          test -s "$ARTIFACT"
          unzip -t "$ARTIFACT" >/dev/null
          SHA256="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          SOURCE_HEAD="$(git -C "$RUNNER_TEMP/libXray" rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$LIBXRAY_COMMIT"
          python3 - <<PY
          import json
          from pathlib import Path
          out = Path("$RUNNER_TEMP/xray/libxray-provenance.json")
          out.write_text(json.dumps({
              "version": 1,
              "kernel": "xray",
              "wrapper": {"repository": "https://github.com/XTLS/libXray", "commit": "$SOURCE_HEAD"},
              "coreDeclaredByPinnedGoMod": {
                  "repository": "https://github.com/XTLS/Xray-core",
                  "moduleVersion": "v1.260327.1-0.20260930074004-b26a91de4f32",
                  "commit": "b26a91de4f3294e26a0ad0a970b81a386a41f789",
                  "release": "v26.9.30 pre-release"
              },
              "buildResolution": "unverified: upstream builder regenerates go.mod/go.sum, performs unversioned dependency operations, and downloads mutable latest geodata",
              "platform": "android",
              "toolchain": {"go": "$(go version)", "java": "temurin-17", "androidNdk": "28.0.13004108"},
              "artifact": {"name": "libXray.aar", "sha256": "$SHA256"},
              "distributionStatus": "blocked"
          }, indent=2) + "\n", encoding="utf-8")
          PY
          cat "$RUNNER_TEMP/xray/libxray-provenance.json"
          echo "No Xray AAR is uploaded or passed to another workflow."
