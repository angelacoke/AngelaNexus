name: xray-android-native-build

on:
  workflow_dispatch:
    inputs:
      evidence_android_run:
        description: "Optional successful android-build push run ID for debug-only AAR packaging replay (no native rebuild)"
        type: string
        default: ""
      evidence_source_commit:
        description: "Full source HEAD of that immutable Android producer run"
        type: string
        default: ""
      evidence_mihomo_run:
        description: "Successful Mihomo three-ABI producer run at this exact workflow HEAD (required for debug replay)"
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/xray-android-native-build.yml"
      - "docs/upstream/XRAY_ANDROID_RUNTIME_COMPLIANCE.json"
      - "native/android/xray-bridge/**"
      - "test/xray-source-compliance.test.js"
      - "native/android/app/src/main/kotlin/app/angelanexus/XrayRuntime*.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/XrayAndroidKernelDriver.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/XrayVpnProtector.kt"
      - "native/android/app/src/main/kotlin/app/angelanexus/AndroidKernelDriverRegistry.kt"
      - "native/android/app/build.gradle.kts"
      - "native/android/app/src/main/AndroidManifest.xml"

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  build:
    if: ${{ inputs.evidence_android_run == '' }}
    name: Verify native Xray runtime build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android24-clang
          - abi: armeabi-v7a
            goarch: arm
            cc: armv7a-linux-androideabi24-clang
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android24-clang
    steps:
      - name: Checkout AngelaNexus
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"
      - name: Fetch pinned source pair and apply reviewed adapter
        shell: bash
        env:
          LIBXRAY_COMMIT: "3c694b23290f9849fe52284a345ebd4343bc90cd"
          CORE_COMMIT: "b26a91de4f3294e26a0ad0a970b81a386a41f789"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray-pair"
          git clone --no-checkout https://github.com/XTLS/libXray.git "$RUNNER_TEMP/xray-pair/libXray"
          git -C "$RUNNER_TEMP/xray-pair/libXray" fetch origin "$LIBXRAY_COMMIT"
          git -C "$RUNNER_TEMP/xray-pair/libXray" checkout --detach "$LIBXRAY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/xray-pair/libXray" rev-parse HEAD)" = "$LIBXRAY_COMMIT"
          git clone --no-checkout https://github.com/XTLS/Xray-core.git "$RUNNER_TEMP/xray-pair/Xray-core"
          git -C "$RUNNER_TEMP/xray-pair/Xray-core" fetch origin "$CORE_COMMIT"
          git -C "$RUNNER_TEMP/xray-pair/Xray-core" checkout --detach "$CORE_COMMIT"
          python3 native/android/xray-bridge/prepare-upstream.py --wrapper "$RUNNER_TEMP/xray-pair/libXray" --core "$RUNNER_TEMP/xray-pair/Xray-core" --provenance "$RUNNER_TEMP/xray/libxray-provenance-${{ matrix.abi }}.json"
      - name: Full related upstream race and independent mux and Portal negative controls
        shell: bash
        env:
          WRAPPER: ${{ runner.temp }}/xray-pair/libXray
          CORE: ${{ runner.temp }}/xray-pair/Xray-core
          NEGATIVE_LOG_DIR: ${{ runner.temp }}/xray/negative-logs
        run: bash native/android/xray-bridge/test-host.sh
      - name: Build Android libXray
        shell: bash
        working-directory: ${{ runner.temp }}/xray-pair/libXray
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
          LIBXRAY_GOMOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"
        run: |
          set -euo pipefail
          python3 build/main.py android local
          test -s libXray.aar
          mkdir -p "$RUNNER_TEMP/xray"
          cp libXray.aar "$RUNNER_TEMP/xray/libXray-${{ matrix.abi }}.aar"
          python3 "$GITHUB_WORKSPACE/native/android/xray-bridge/prepare-upstream.py" --wrapper "$PWD" --core "$RUNNER_TEMP/xray-pair/Xray-core" --verify-prepared
          python3 "$GITHUB_WORKSPACE/native/android/xray-bridge/verify-artifact.py" "$RUNNER_TEMP/xray/libXray-${{ matrix.abi }}.aar" --provenance "$RUNNER_TEMP/xray/libxray-provenance-${{ matrix.abi }}.json" --stamp --android --abi "${{ matrix.abi }}"
      - name: Verify artifact and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 native/android/xray-bridge/verify-artifact.py "$RUNNER_TEMP/xray/libXray-${{ matrix.abi }}.aar" --provenance "$RUNNER_TEMP/xray/libxray-provenance-${{ matrix.abi }}.json"
          cat "$RUNNER_TEMP/xray/libxray-provenance-${{ matrix.abi }}.json"
      - name: Upload verified Xray runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-native-runtime-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/xray/libXray-${{ matrix.abi }}.aar
            ${{ runner.temp }}/xray/libxray-provenance-${{ matrix.abi }}.json
            ${{ runner.temp }}/xray/negative-logs/*.log
          if-no-files-found: error
          retention-days: 14

  debug-packaging-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_android_run != '' }}
    name: Verify prebuilt AAR bytes in debug APK (not release or device acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch exact successful source-run AARs (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_android_run }}
          SOURCE_SHA: ${{ inputs.evidence_source_commit }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-android-debug-evidence.py --run-id "$SOURCE_RUN" \
            --source-commit "$SOURCE_SHA" --output "$RUNNER_TEMP/debug-evidence/aars"
          mkdir -p native/android/app/libs
          cp "$RUNNER_TEMP/debug-evidence/aars/"* native/android/app/libs/
          GITHUB_SHA="$SOURCE_SHA" python3 native/android/xray-bridge/verify-artifact.py \
            native/android/app/libs/libXray.aar --provenance native/android/app/libs/libxray-provenance.json
      - name: Verify and install exact-HEAD Mihomo cores independently of JNI shim
        env:
          GH_TOKEN: ${{ github.token }}
          MIHOMO_RUN: ${{ inputs.evidence_mihomo_run }}
        run: |
          set -euo pipefail
          test -n "$MIHOMO_RUN"
          python3 scripts/mihomo-debug-evidence.py prepare --run-id "$MIHOMO_RUN" \
            --source-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/debug-evidence/mihomo"
          mkdir -p native/android/app/build/generated/mihomoDebugEvidence
          cp -R "$RUNNER_TEMP/debug-evidence/mihomo/jniLibs" native/android/app/build/generated/mihomoDebugEvidence/
      - name: Build canonical Android assets
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run core:android:bundle
      - name: Assemble debug APK only (no release credentials or tasks)
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace -Pangelanexus.debugNativePackagingEvidence=true assembleDebug
      - name: Verify each packaged ABI against the selected AAR and source lock
        env:
          SOURCE_SHA: ${{ inputs.evidence_source_commit }}
        run: |
          set -euo pipefail
          python3 scripts/verify-android-debug-native-package.py \
            --apk native/android/app/build/outputs/apk/debug/app-debug.apk \
            --aar native/android/app/libs/libXray.aar \
            --provenance native/android/app/libs/libxray-provenance.json \
            --expected-commit "$SOURCE_SHA" --report "$RUNNER_TEMP/debug-evidence/packaging-report.json"
          python3 scripts/mihomo-debug-evidence.py verify \
            --apk native/android/app/build/outputs/apk/debug/app-debug.apk \
            --evidence-root "$RUNNER_TEMP/debug-evidence/mihomo" \
            --expected-commit "$GITHUB_SHA" --report "$RUNNER_TEMP/debug-evidence/mihomo-packaging-report.json"
      - name: Upload inspectable debug APK and exact producer evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-native-evidence-${{ inputs.evidence_android_run }}
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/debug-evidence/
          if-no-files-found: error
          retention-days: 14
