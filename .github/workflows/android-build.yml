name: android-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prepare-xray:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"
      - name: Build pinned libXray AAR
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
          LIBXRAY_COMMIT: "3c694b23290f9849fe52284a345ebd4343bc90cd"
          LIBXRAY_GOMOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/XTLS/libXray.git "$RUNNER_TEMP/libXray"
          git -C "$RUNNER_TEMP/libXray" fetch origin "$LIBXRAY_COMMIT"
          git -C "$RUNNER_TEMP/libXray" checkout --detach "$LIBXRAY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/libXray" rev-parse HEAD)" = "$LIBXRAY_COMMIT"
          cd "$RUNNER_TEMP/libXray"
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p "$GITHUB_WORKSPACE/native/android/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/native/android/app/libs/libXray.aar"
          sha256sum "$GITHUB_WORKSPACE/native/android/app/libs/libXray.aar"
      - name: Build pinned sing-box libbox AAR
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
          SINGBOX_REF: "v1.14.0-beta.4"
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          git clone --depth 1 --branch "$SINGBOX_REF" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          test "$(git -C "$RUNNER_TEMP/sing-box" describe --tags --exact-match)" = "$SINGBOX_REF"
          cd "$RUNNER_TEMP/sing-box"
          go run ./cmd/internal/build_libbox -target android
          test -s libbox.aar
          test -s libbox-legacy.aar
          cp libbox.aar "$GITHUB_WORKSPACE/native/android/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/native/android/app/libs/libbox-legacy.aar"
          sha256sum "$GITHUB_WORKSPACE/native/android/app/libs/libbox.aar" "$GITHUB_WORKSPACE/native/android/app/libs/libbox-legacy.aar"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/deduplicate-libxray-aar.py native/android/app/libs/libXray.aar
          unzip -p native/android/app/libs/libXray.aar classes.jar > "$RUNNER_TEMP/libXray-classes.jar"
          unzip -p native/android/app/libs/libbox.aar classes.jar > "$RUNNER_TEMP/libbox-classes.jar"
          ! jar tf "$RUNNER_TEMP/libXray-classes.jar" | grep -q "^go/"
          jar tf "$RUNNER_TEMP/libbox-classes.jar" | grep -q "^go/Seq.class$"
          echo "libXray AAR Java runtime deduplicated successfully"

      - name: Upload prepared Android native kernel AARs
        uses: actions/upload-artifact@v4
        with:
          name: angelanexus-android-native-kernel-aars
          path: |
            native/android/app/libs/libXray.aar
            native/android/app/libs/libbox.aar
            native/android/app/libs/libbox-legacy.aar
          if-no-files-found: error
          retention-days: 1

  android-debug:
    needs: prepare-xray
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical Android Core bundle
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run core:android:bundle
          test -s native/android/app/src/main/assets/angelanexus-core.bundle.js
      - uses: actions/download-artifact@v4
        with:
          name: angelanexus-android-native-kernel-aars
          path: native/android/app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify libXray AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s native/android/app/libs/libXray.aar
          test -s native/android/app/libs/libbox.aar
          test -s native/android/app/libs/libbox-legacy.aar
          unzip -t native/android/app/libs/libXray.aar >/dev/null
          unzip -t native/android/app/libs/libbox.aar >/dev/null
          unzip -t native/android/app/libs/libbox-legacy.aar >/dev/null
      - name: Run Android unit tests
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace testDebugUnitTest
      - name: Assemble Android debug APK
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace --info assembleDebug
      - name: Run Android emulator runtime smoke test
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libpulse0
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$AVDMANAGER"
          test -x "$EMULATOR"
          test -x "$ADB"
          echo "Using emulator binary: $EMULATOR"
          "$EMULATOR" -version
          echo "no" | "$AVDMANAGER" create avd --force --name angelanexus-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          nohup "$EMULATOR" -avd angelanexus-api35 -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -accel off >"$RUNNER_TEMP/angelanexus-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "=== emulator diagnostics ==="
              "$ADB" devices -l || true
              "$ADB" shell getprop ro.build.version.release || true
              "$ADB" shell getprop sys.boot_completed || true
              "$ADB" shell pidof app.angelanexus || true
              "$ADB" shell dumpsys activity activities | tail -n 160 || true
              "$ADB" logcat -d -t 300 || true
              echo "=== emulator process log ==="
              cat "$RUNNER_TEMP/angelanexus-emulator.log" || true
            fi
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit "$rc"
          }
          trap cleanup EXIT
          "$ADB" start-server
          echo "Waiting up to 180 seconds for emulator device connection"
          if ! timeout 180 "$ADB" wait-for-device; then
            echo "ERROR: adb did not detect the emulator within 180 seconds"
            cat "$RUNNER_TEMP/angelanexus-emulator.log" || true
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 90); do
            if "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1'; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            echo "ERROR: emulator did not finish booting within 180 seconds"
            "$ADB" devices -l || true
            "$ADB" shell getprop sys.boot_completed || true
            cat "$RUNNER_TEMP/angelanexus-emulator.log" || true
            exit 1
          fi
          "$ADB" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1'
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          APK="native/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ADB" install -r "$APK"
          "$ADB" shell am force-stop app.angelanexus
          "$ADB" shell am start -W -n app.angelanexus/.MainActivity
          for attempt in $(seq 1 20); do
            if "$ADB" shell pidof app.angelanexus 2>/dev/null | tr -d '\r' | grep -q '[0-9]'; then
              break
            fi
            sleep 1
          done
          "$ADB" shell pidof app.angelanexus | tr -d '\r' | grep -q '[0-9]'
          "$ADB" shell dumpsys activity activities | grep -q "app.angelanexus/.MainActivity"
          "$ADB" shell pm path app.angelanexus | grep -q '^package:'
          echo "Android runtime smoke test passed: APK installed, launcher activity started, process alive."

  android-release:
    needs: prepare-xray
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANGELANEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_B64 }}
      ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD }}
      ANGELANEXUS_RELEASE_KEY_ALIAS: ${{ secrets.ANGELANEXUS_RELEASE_KEY_ALIAS }}
      ANGELANEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical Android Core bundle
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run core:android:bundle
          test -s native/android/app/src/main/assets/angelanexus-core.bundle.js
      - uses: actions/download-artifact@v4
        with:
          name: angelanexus-android-native-kernel-aars
          path: native/android/app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify signing configuration is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANGELANEXUS_RELEASE_KEYSTORE_B64"
          test -n "$ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANGELANEXUS_RELEASE_KEY_ALIAS"
          test -n "$ANGELANEXUS_RELEASE_KEY_PASSWORD"
      - name: Verify libXray AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s native/android/app/libs/libXray.aar
          test -s native/android/app/libs/libbox.aar
          test -s native/android/app/libs/libbox-legacy.aar
          unzip -t native/android/app/libs/libXray.aar >/dev/null
          unzip -t native/android/app/libs/libbox.aar >/dev/null
          unzip -t native/android/app/libs/libbox-legacy.aar >/dev/null
      - name: Assemble signed release APK and AAB
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace assembleRelease bundleRelease
      - name: Verify release artifacts and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/release/app-release.apk"
          AAB="native/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          printf '%s' "$ANGELANEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > /tmp/angelanexus-release.keystore
          chmod 600 /tmp/angelanexus-release.keystore
          KEYTOOL_OUTPUT="$(keytool -list -v -keystore /tmp/angelanexus-release.keystore -storepass "$ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$ANGELANEXUS_RELEASE_KEY_ALIAS")"
          EXPECTED_CERT_SHA256="$(printf '%s' "$KEYTOOL_OUTPUT" | awk '/^[[:space:]]*SHA256:/ {sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"
          test -n "$EXPECTED_CERT_SHA256"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s' "$CERT_OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s' "$CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$ACTUAL_CERT_SHA256"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(printf '%s' "$ACTUAL_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: release APK certificate does not match the configured production keystore."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Production signing certificate verified: $ACTUAL"
          rm -f /tmp/angelanexus-release.keystore
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AngelaNexus-android-release-${{ github.sha }}
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
