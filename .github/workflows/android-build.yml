name: android-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prepare-xray:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.0.13004108"
      - name: Build pinned libXray AAR
        shell: bash
        env:
          GOTOOLCHAIN: go1.27.1
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
          LIBXRAY_COMMIT: "3c694b23290f9849fe52284a345ebd4343bc90cd"
          LIBXRAY_GOMOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libXray-parent"
          git clone --no-checkout https://github.com/XTLS/libXray.git "$RUNNER_TEMP/libXray"
          git -C "$RUNNER_TEMP/libXray" fetch origin "$LIBXRAY_COMMIT"
          git -C "$RUNNER_TEMP/libXray" checkout --detach "$LIBXRAY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/libXray" rev-parse HEAD)" = "$LIBXRAY_COMMIT"
          git clone --no-checkout https://github.com/XTLS/Xray-core.git "$RUNNER_TEMP/libXray-parent/Xray-core"
          git -C "$RUNNER_TEMP/libXray-parent/Xray-core" fetch origin b26a91de4f3294e26a0ad0a970b81a386a41f789
          git -C "$RUNNER_TEMP/libXray-parent/Xray-core" checkout --detach b26a91de4f3294e26a0ad0a970b81a386a41f789
          mv "$RUNNER_TEMP/libXray" "$RUNNER_TEMP/libXray-parent/libXray"
          python3 "$GITHUB_WORKSPACE/native/android/xray-bridge/prepare-upstream.py" --wrapper "$RUNNER_TEMP/libXray-parent/libXray" --core "$RUNNER_TEMP/libXray-parent/Xray-core" --provenance "$RUNNER_TEMP/libXray-parent/provenance.json"
          WRAPPER="$RUNNER_TEMP/libXray-parent/libXray" CORE="$RUNNER_TEMP/libXray-parent/Xray-core" NEGATIVE_LOG_DIR="$RUNNER_TEMP/xray-negative-logs" bash native/android/xray-bridge/test-host.sh
          cd "$RUNNER_TEMP/libXray-parent/libXray"
          python3 build/main.py android local
          test -s libXray.aar
          mkdir -p "$GITHUB_WORKSPACE/native/android/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/native/android/app/libs/libXray.aar"
          python3 "$GITHUB_WORKSPACE/native/android/xray-bridge/prepare-upstream.py" --wrapper "$PWD" --core "$RUNNER_TEMP/libXray-parent/Xray-core" --verify-prepared
          python3 "$GITHUB_WORKSPACE/native/android/xray-bridge/verify-artifact.py" "$GITHUB_WORKSPACE/native/android/app/libs/libXray.aar" --provenance "$RUNNER_TEMP/libXray-parent/provenance.json" --stamp --android
          cp "$RUNNER_TEMP/libXray-parent/provenance.json" "$GITHUB_WORKSPACE/native/android/app/libs/libxray-provenance.json"
      - name: Build pinned sing-box libbox AAR
        shell: bash
        env:
          GOTOOLCHAIN: go1.26.8
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108
          SINGBOX_REF: "v1.14.0-beta.4"
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          git clone --depth 1 --branch "$SINGBOX_REF" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          test "$(git -C "$RUNNER_TEMP/sing-box" describe --tags --exact-match)" = "$SINGBOX_REF"
          cd "$RUNNER_TEMP/sing-box"
          go run ./cmd/internal/build_libbox -target android
          test -s libbox.aar
          test -s libbox-legacy.aar
          cp libbox.aar "$GITHUB_WORKSPACE/native/android/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/native/android/app/libs/libbox-legacy.aar"
          sha256sum "$GITHUB_WORKSPACE/native/android/app/libs/libbox.aar" "$GITHUB_WORKSPACE/native/android/app/libs/libbox-legacy.aar"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/deduplicate-libxray-aar.py native/android/app/libs/libXray.aar
          python3 native/android/xray-bridge/verify-artifact.py native/android/app/libs/libXray.aar --provenance native/android/app/libs/libxray-provenance.json --stamp --deduplicated
          python3 native/android/xray-bridge/verify-artifact.py native/android/app/libs/libXray.aar --provenance native/android/app/libs/libxray-provenance.json
          unzip -p native/android/app/libs/libXray.aar classes.jar > "$RUNNER_TEMP/libXray-classes.jar"
          unzip -p native/android/app/libs/libbox.aar classes.jar > "$RUNNER_TEMP/libbox-classes.jar"
          ! jar tf "$RUNNER_TEMP/libXray-classes.jar" | grep -q "^go/"
          jar tf "$RUNNER_TEMP/libbox-classes.jar" | grep -q "^go/Seq.class$"
          echo "libXray AAR Java runtime deduplicated successfully"

      - name: Upload prepared Android native kernel AARs
        uses: actions/upload-artifact@v4
        with:
          name: angelanexus-android-native-kernel-aars
          path: |
            native/android/app/libs/libXray.aar
            native/android/app/libs/libxray-provenance.json
            native/android/app/libs/libbox.aar
            native/android/app/libs/libbox-legacy.aar
          if-no-files-found: error
          retention-days: 1

  android-debug:
    needs: prepare-xray
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical Android Core bundle
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run core:android:bundle
          test -s native/android/app/src/main/assets/angelanexus-core.bundle.js
      - uses: actions/download-artifact@v4
        with:
          name: angelanexus-android-native-kernel-aars
          path: native/android/app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify libXray AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s native/android/app/libs/libXray.aar
          test -s native/android/app/libs/libbox.aar
          test -s native/android/app/libs/libbox-legacy.aar
          unzip -t native/android/app/libs/libXray.aar >/dev/null
          python3 native/android/xray-bridge/verify-artifact.py native/android/app/libs/libXray.aar --provenance native/android/app/libs/libxray-provenance.json
          unzip -t native/android/app/libs/libbox.aar >/dev/null
          unzip -t native/android/app/libs/libbox-legacy.aar >/dev/null
      - name: Run Android unit tests
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace testDebugUnitTest
      - name: Assemble Android debug APK
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace --info -Pangelanexus.debugNativePackagingEvidence=true assembleDebug
      - name: Verify actual debug APK native bytes against source-locked AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-android-debug-native-package.py \
            --apk native/android/app/build/outputs/apk/debug/app-debug.apk \
            --aar native/android/app/libs/libXray.aar \
            --provenance native/android/app/libs/libxray-provenance.json \
            --expected-commit "$GITHUB_SHA" --report "$RUNNER_TEMP/android-debug-native-package.json"
      - name: Run Android emulator smoke and configuration import UI tests
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libpulse0
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$AVDMANAGER"
          test -x "$EMULATOR"
          test -x "$ADB"
          echo "Using emulator binary: $EMULATOR"
          "$EMULATOR" -version
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: this runner does not expose /dev/kvm; hardware-accelerated Android emulation is unavailable."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "Creating AVD under $ANDROID_AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd --force --name angelanexus-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          test -s "$ANDROID_AVD_HOME/angelanexus-api35.ini"
          "$EMULATOR" -list-avds | grep -Fx "angelanexus-api35"
          nohup "$EMULATOR" -avd angelanexus-api35 -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -writable-system -accel on >"$RUNNER_TEMP/angelanexus-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          FIXTURE_PID=""
          cleanup() {
            rc=$?
            "$ADB" logcat -d -v threadtime > "$RUNNER_TEMP/angelanexus-logcat.txt" 2>&1 || true
            "$ADB" shell dumpsys activity activities > "$RUNNER_TEMP/angelanexus-activities.txt" 2>&1 || true
            "$ADB" exec-out screencap -p > "$RUNNER_TEMP/android-config-import-ui.png" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then
              echo "=== emulator diagnostics ==="
              "$ADB" devices -l || true
              "$ADB" shell getprop ro.build.version.release || true
              "$ADB" shell getprop sys.boot_completed || true
              "$ADB" shell pidof app.angelanexus || true
              "$ADB" shell dumpsys activity activities | tail -n 160 || true
              "$ADB" logcat -d -t 300 || true
              echo "=== emulator process log ==="
              cat "$RUNNER_TEMP/angelanexus-emulator.log" || true
            fi
            if [ -n "$FIXTURE_PID" ]; then
              kill "$FIXTURE_PID" 2>/dev/null || true
              wait "$FIXTURE_PID" 2>/dev/null || true
            fi
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit "$rc"
          }
          trap cleanup EXIT
          "$ADB" start-server
          echo "Waiting up to 180 seconds for emulator device connection"
          if ! timeout 180 "$ADB" wait-for-device; then
            echo "ERROR: adb did not detect the emulator within 180 seconds"
            cat "$RUNNER_TEMP/angelanexus-emulator.log" || true
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 180); do
            if "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1'; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            echo "ERROR: emulator did not finish booting within 360 seconds"
            "$ADB" devices -l || true
            "$ADB" shell getprop sys.boot_completed || true
            cat "$RUNNER_TEMP/angelanexus-emulator.log" || true
            exit 1
          fi
          "$ADB" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1'
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          # Trust a per-run CA only inside this disposable AVD so the app can fetch
          # one fixed, local HTTPS subscription fixture; no external subscription is used.
          FIXTURE_DIR="$RUNNER_TEMP/angelanexus-ui-import-fixture"
          mkdir -p "$FIXTURE_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$FIXTURE_DIR/ca.key" -out "$FIXTURE_DIR/ca.pem" \
            -subj "/CN=AngelaNexus ephemeral UI fixture CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -sha256 \
            -keyout "$FIXTURE_DIR/server.key" -out "$FIXTURE_DIR/server.csr" \
            -subj "/CN=10.0.2.2"
          cat > "$FIXTURE_DIR/server.ext" <<'EOF'
          [v3_req]
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=IP:10.0.2.2
          EOF
          openssl x509 -req -in "$FIXTURE_DIR/server.csr" \
            -CA "$FIXTURE_DIR/ca.pem" -CAkey "$FIXTURE_DIR/ca.key" -CAcreateserial \
            -out "$FIXTURE_DIR/server.pem" -days 1 -sha256 \
            -extfile "$FIXTURE_DIR/server.ext" -extensions v3_req
          CA_HASH="$(openssl x509 -in "$FIXTURE_DIR/ca.pem" -subject_hash_old -noout)"
          openssl x509 -in "$FIXTURE_DIR/ca.pem" -outform PEM > "$FIXTURE_DIR/$CA_HASH.0"
          "$ADB" root
          timeout 60 "$ADB" wait-for-device
          "$ADB" remount
          timeout 60 "$ADB" wait-for-device
          "$ADB" push "$FIXTURE_DIR/$CA_HASH.0" "/system/etc/security/cacerts/$CA_HASH.0"
          "$ADB" shell restorecon "/system/etc/security/cacerts/$CA_HASH.0"
          "$ADB" shell chown root:root "/system/etc/security/cacerts/$CA_HASH.0"
          "$ADB" shell chmod 0644 "/system/etc/security/cacerts/$CA_HASH.0"
          "$ADB" reboot
          timeout 180 "$ADB" wait-for-device
          booted=false
          for attempt in $(seq 1 180); do
            if "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1'; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true
          "$ADB" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1'
          "$ADB" shell test -r "/system/etc/security/cacerts/$CA_HASH.0"
          "$ADB" shell ls -l "/system/etc/security/cacerts/$CA_HASH.0"
          printf '%s\n' 'vless://user@node-fixture.invalid:443' > "$RUNNER_TEMP/angelanexus-ui-local-fixture.txt"
          nohup env UI_FIXTURE_CERT="$FIXTURE_DIR/server.pem" \
            UI_FIXTURE_KEY="$FIXTURE_DIR/server.key" UI_FIXTURE_PORT=18443 \
            node scripts/android-config-import-fixture-server.mjs \
            > "$RUNNER_TEMP/android-config-import-fixture-server.log" 2>&1 &
          FIXTURE_PID=$!
          server_ready=false
          for attempt in $(seq 1 30); do
            if grep -q "loopback UI fixture ready" "$RUNNER_TEMP/android-config-import-fixture-server.log" 2>/dev/null; then
              server_ready=true
              break
            fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$server_ready" != true ]; then
            cat "$RUNNER_TEMP/android-config-import-fixture-server.log" || true
            exit 1
          fi
          APK="native/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ADB="$ADB" APK="$APK" node scripts/android-runtime-smoke.mjs
          ADB="$ADB" FIXTURE_LOCAL_PATH="$RUNNER_TEMP/angelanexus-ui-local-fixture.txt" \
            SUBSCRIPTION_URL="https://10.0.2.2:18443/subscription" \
            node scripts/android-config-import-ui-smoke.mjs \
            | tee "$RUNNER_TEMP/android-config-import-ui-results.txt"
          "$ADB" exec-out screencap -p > "$RUNNER_TEMP/android-config-import-ui.png"
          kill "$FIXTURE_PID" 2>/dev/null || true
          if wait "$FIXTURE_PID"; then fixture_exit=0; else fixture_exit=$?; fi
          FIXTURE_PID=""
          test "$fixture_exit" -eq 0
          served="$(grep -c "served fixed subscription fixture" "$RUNNER_TEMP/android-config-import-fixture-server.log" || true)"
          test "$served" -eq 1
          rejected="$(grep -c "Rejected unexpected fixture request" "$RUNNER_TEMP/android-config-import-fixture-server.log" || true)"
          test "$rejected" -eq 0
          {
            echo "## Android configuration import UI tests"
            cat "$RUNNER_TEMP/android-config-import-ui-results.txt"
            echo "- Subscription fetch was served once by the runner-local HTTPS fixture at 10.0.2.2:18443."
            echo "- No VPN permission or proxy runtime was started."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android debug APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AngelaNexus-android-debug-${{ github.sha }}-${{ github.event_name }}
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/angelanexus-emulator.log
            ${{ runner.temp }}/angelanexus-logcat.txt
            ${{ runner.temp }}/angelanexus-activities.txt
            ${{ runner.temp }}/android-debug-native-package.json
            native/android/app/libs/libxray-provenance.json
            ${{ runner.temp }}/android-config-import-ui-results.txt
            ${{ runner.temp }}/android-config-import-ui.png
            ${{ runner.temp }}/android-config-import-fixture-server.log
          if-no-files-found: warn
          retention-days: 14

  android-release:
    needs: prepare-xray
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANGELANEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_B64 }}
      ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD }}
      ANGELANEXUS_RELEASE_KEY_ALIAS: ${{ secrets.ANGELANEXUS_RELEASE_KEY_ALIAS }}
      ANGELANEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical Android Core bundle
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run core:android:bundle
          test -s native/android/app/src/main/assets/angelanexus-core.bundle.js
      - uses: actions/download-artifact@v4
        with:
          name: angelanexus-android-native-kernel-aars
          path: native/android/app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify signing configuration is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANGELANEXUS_RELEASE_KEYSTORE_B64"
          test -n "$ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANGELANEXUS_RELEASE_KEY_ALIAS"
          test -n "$ANGELANEXUS_RELEASE_KEY_PASSWORD"
      - name: Verify libXray AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s native/android/app/libs/libXray.aar
          test -s native/android/app/libs/libbox.aar
          test -s native/android/app/libs/libbox-legacy.aar
          unzip -t native/android/app/libs/libXray.aar >/dev/null
          python3 native/android/xray-bridge/verify-artifact.py native/android/app/libs/libXray.aar --provenance native/android/app/libs/libxray-provenance.json
          unzip -t native/android/app/libs/libbox.aar >/dev/null
          unzip -t native/android/app/libs/libbox-legacy.aar >/dev/null
      - name: Assemble signed release APK and AAB
        working-directory: native/android
        run: gradle --no-daemon --console=plain --stacktrace assembleRelease bundleRelease
      - name: Verify release artifacts and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/release/app-release.apk"
          AAB="native/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          printf '%s' "$ANGELANEXUS_RELEASE_KEYSTORE_B64" | base64 --decode > /tmp/angelanexus-release.keystore
          chmod 600 /tmp/angelanexus-release.keystore
          KEYTOOL_OUTPUT="$(keytool -list -v -keystore /tmp/angelanexus-release.keystore -storepass "$ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD" -alias "$ANGELANEXUS_RELEASE_KEY_ALIAS")"
          EXPECTED_CERT_SHA256="$(printf '%s' "$KEYTOOL_OUTPUT" | awk '/^[[:space:]]*SHA256:/ {sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"
          test -n "$EXPECTED_CERT_SHA256"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s' "$CERT_OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s' "$CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$ACTUAL_CERT_SHA256"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(printf '%s' "$ACTUAL_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: release APK certificate does not match the configured production keystore."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Production signing certificate verified: $ACTUAL"
          rm -f /tmp/angelanexus-release.keystore
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AngelaNexus-android-release-${{ github.sha }}
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
