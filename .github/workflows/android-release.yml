name: android-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANGELANEXUS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Assemble signed release APK
        working-directory: native/android
        env:
          ANGELANEXUS_RELEASE_KEYSTORE_B64: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_B64 }}
          ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEYSTORE_PASSWORD }}
          ANGELANEXUS_RELEASE_KEY_ALIAS: ${{ secrets.ANGELANEXUS_RELEASE_KEY_ALIAS }}
          ANGELANEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.ANGELANEXUS_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain --stacktrace assembleRelease

      - name: Verify APK signature
        working-directory: native/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          apksigner verify --verbose "$APK"

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelaNexus-android-release
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  telegram-delivery:
    name: Sync Android package to Telegram
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ needs.release.result == 'success' }}
    steps:
      - name: Download signed release package
        uses: actions/download-artifact@v4
        with:
          name: AngelaNexus-android-release
          path: package

      - name: Validate Telegram delivery configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Compute package digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          APK="package/app-release.apk"
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Send package to Telegram bot target
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PACKAGE_PATH: package/app-release.apk
          PACKAGE_SHA256: ${{ steps.digest.outputs.sha256 }}
          PACKAGE_SIZE: ${{ steps.digest.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          CAPTION="AngelaNexus Android package
commit: ${GITHUB_SHA}
workflow: ${GITHUB_RUN_NUMBER}
artifact: app-release.apk
size: ${PACKAGE_SIZE} bytes
SHA-256: ${PACKAGE_SHA256}"

          curl --fail-with-body --silent --show-error             --request POST             --form "chat_id=${TELEGRAM_CHAT_ID}"             --form "caption=${CAPTION}"             --form "document=@${PACKAGE_PATH}"             "${API}/sendDocument" > telegram-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("telegram-response.json").read_text(encoding="utf-8"))
          if data.get("ok") is not True:
              raise SystemExit(f"Telegram delivery rejected: {data.get('description', 'unknown error')}")
          print("Telegram package delivery verified: API returned ok=true")
          PY

      - name: Publish delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: AngelaNexus-android-telegram-delivery-${{ github.sha }}
          path: telegram-response.json
          if-no-files-found: error
          retention-days: 14
